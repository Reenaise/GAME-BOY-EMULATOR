# Key mapping for gameboy-emulator  (use with:  --keys keys.example.cfg)
#
# <Game Boy button> = <SDL key name>
# Buttons: Up Down Left Right A B Start Select
# Key names are SDL names, e.g. X, Z, Return, Backspace, Space, Left Shift,
# Up, Down, Left, Right, W, A, S, D, J, K, Keypad 8 ...

Up     = Up
Down   = Down
Left   = Left
Right  = Right
A      = X
B      = Z
Start  = Return
Select = Backspace

# WASD layout example:
# Up = W
# Left = A
# Down = S
# Right = D
# A = K
# B = J
